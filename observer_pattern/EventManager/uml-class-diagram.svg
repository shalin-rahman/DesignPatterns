<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title description">
  <title id="title">EventManager - Observer Design Pattern Class Diagram</title>
  <desc id="description">UML Class Diagram showing Editor, EventManager, EventListener interface, EmailNotificationListener, and LogOpenListener.</desc>
  <defs>
    <!-- Hollow triangle for realization / interface implementation -->
    <marker id="hollow-triangle" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" class="hollow-arrow"/>
    </marker>
    <!-- Open arrow for association -->
    <marker id="association-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" class="nav-arrow"/>
    </marker>
    <!-- Filled Diamond for composition -->
    <marker id="diamond" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 7 L 7 2 L 13 7 L 7 12 Z" class="diamond-shape"/>
    </marker>
    <style>
      :root {
        color-scheme: light dark;
        --text: #172b4d;
        --muted: #5e6c84;
        --surface: #ffffff;
        --line: #25364a;
        --accent: #0052cc;
        --highlight: #0b69a3;
      }
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif; fill: var(--text); }
      .title { font-size: 20px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: var(--muted); }
      .stereotype { font-size: 13px; font-style: italic; fill: var(--muted); }
      .class-name { font-size: 15px; font-weight: 700; }
      .section { font-size: 12.5px; }
      .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
      .divider { stroke: var(--line); stroke-width: 1.2; }
      .relation { fill: none; stroke: var(--line); stroke-width: 1.6; }
      .dashed { stroke-dasharray: 6 4; }
      .hollow-arrow { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
      .nav-arrow { fill: none; stroke: var(--line); stroke-width: 1.5; }
      .diamond-shape { fill: var(--line); stroke: var(--line); stroke-width: 1.5; }
      .badge-pub { fill: #e3f2fd; stroke: #1976d2; }
      .badge-obs { fill: #f3e5f5; stroke: #7b1fa2; }
      .badge-con { fill: #e8f5e9; stroke: #388e3c; }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e6edf7;
          --muted: #9aaec7;
          --surface: #1e293b;
          --line: #8fa0b5;
          --accent: #579dff;
          --highlight: #38bdf8;
        }
        .box { fill: #1e293b; stroke: #8fa0b5; }
        .hollow-arrow { fill: #1e293b; stroke: #8fa0b5; }
        .diamond-shape { fill: #8fa0b5; stroke: #8fa0b5; }
        .badge-pub { fill: #0d47a1; stroke: #42a5f5; }
        .badge-obs { fill: #4a148c; stroke: #ba68c8; }
        .badge-con { fill: #1b5e20; stroke: #81c784; }
      }
    </style>
  </defs>

  <!-- Title & Legend -->
  <text x="40" y="45" class="title">Refactoring Guru: Observer Pattern (EventManager / File Editor)</text>
  <text x="40" y="70" class="subtitle">Complete Class Diagram — Decoupling Business Logic (Editor) from Event Subscribers via EventManager</text>

  <!-- Legend Boxes -->
  <g transform="translate(730, 25)">
    <rect x="0" y="0" width="18" height="18" rx="3" class="badge-pub" />
    <text x="26" y="14" class="section">Publisher / Context</text>
    <rect x="165" y="0" width="18" height="18" rx="3" class="badge-obs" />
    <text x="191" y="14" class="section">Observer / Subscriber</text>
    <rect x="330" y="0" width="18" height="18" rx="3" class="badge-con" />
    <text x="356" y="14" class="section">Concrete Subscriber</text>
  </g>

  <!-- ==================== 1. Editor (Context / Concrete Publisher) ==================== -->
  <g transform="translate(50, 110)">
    <rect width="280" height="180" rx="6" class="box"/>
    <rect width="280" height="36" rx="6" class="badge-pub" fill-opacity="0.25"/>
    <text x="140" y="24" text-anchor="middle" class="class-name">Editor</text>
    <line x1="0" y1="36" x2="280" y2="36" class="divider"/>
    <text x="14" y="58" class="section">+ events : EventManager</text>
    <text x="14" y="78" class="section">- file : File</text>
    <line x1="0" y1="92" x2="280" y2="92" class="divider"/>
    <text x="14" y="114" class="section">+ Editor()</text>
    <text x="14" y="134" class="section">+ openFile(filePath: String) : void</text>
    <text x="14" y="154" class="section">+ saveFile() : void</text>
    <text x="14" y="174" class="section">+ getFile() : File</text>
  </g>

  <!-- ==================== 2. EventManager (Event Publisher) ==================== -->
  <g transform="translate(420, 110)">
    <rect width="320" height="190" rx="6" class="box"/>
    <rect width="320" height="36" rx="6" class="badge-pub" fill-opacity="0.25"/>
    <text x="160" y="24" text-anchor="middle" class="class-name">EventManager</text>
    <line x1="0" y1="36" x2="320" y2="36" class="divider"/>
    <text x="14" y="58" class="section">- listeners : Map&lt;String, List&lt;EventListener&gt;&gt;</text>
    <line x1="0" y1="72" x2="320" y2="72" class="divider"/>
    <text x="14" y="94" class="section">+ EventManager(operations: String...)</text>
    <text x="14" y="116" class="section">+ subscribe(eventType: String, l: EventListener) : void</text>
    <text x="14" y="138" class="section">+ unsubscribe(eventType: String, l: EventListener) : void</text>
    <text x="14" y="160" class="section">+ notify(eventType: String, file: File) : void</text>
  </g>

  <!-- ==================== 3. EventListener (Observer Interface) ==================== -->
  <g transform="translate(830, 130)">
    <rect width="300" height="130" rx="6" class="box"/>
    <rect width="300" height="46" rx="6" class="badge-obs" fill-opacity="0.25"/>
    <text x="150" y="20" text-anchor="middle" class="stereotype">&lt;&lt;interface&gt;&gt;</text>
    <text x="150" y="38" text-anchor="middle" class="class-name">EventListener</text>
    <line x1="0" y1="46" x2="300" y2="46" class="divider"/>
    <text x="14" y="70" class="section" fill="var(--muted)">// Subscriber contract</text>
    <line x1="0" y1="80" x2="300" y2="80" class="divider"/>
    <text x="14" y="106" class="section">+ update(eventType: String, file: File) : void</text>
  </g>

  <!-- ==================== 4. EmailNotificationListener ==================== -->
  <g transform="translate(680, 420)">
    <rect width="280" height="160" rx="6" class="box"/>
    <rect width="280" height="36" rx="6" class="badge-con" fill-opacity="0.25"/>
    <text x="140" y="24" text-anchor="middle" class="class-name">EmailNotificationListener</text>
    <line x1="0" y1="36" x2="280" y2="36" class="divider"/>
    <text x="14" y="58" class="section">- email : String</text>
    <line x1="0" y1="72" x2="280" y2="72" class="divider"/>
    <text x="14" y="94" class="section">+ EmailNotificationListener(email: String)</text>
    <text x="14" y="116" class="section">+ update(eventType: String, file: File) : void</text>
    <text x="14" y="138" class="section">+ getEmail() : String</text>
  </g>

  <!-- ==================== 5. LogOpenListener ==================== -->
  <g transform="translate(250, 420)">
    <rect width="280" height="160" rx="6" class="box"/>
    <rect width="280" height="36" rx="6" class="badge-con" fill-opacity="0.25"/>
    <text x="140" y="24" text-anchor="middle" class="class-name">LogOpenListener</text>
    <line x1="0" y1="36" x2="280" y2="36" class="divider"/>
    <text x="14" y="58" class="section">- log : File</text>
    <line x1="0" y1="72" x2="280" y2="72" class="divider"/>
    <text x="14" y="94" class="section">+ LogOpenListener(fileName: String)</text>
    <text x="14" y="116" class="section">+ update(eventType: String, file: File) : void</text>
    <text x="14" y="138" class="section">+ getLog() : File</text>
  </g>

  <!-- ==================== RELATIONSHIPS ==================== -->

  <!-- Composition: Editor has-a EventManager -->
  <line x1="330" y1="200" x2="420" y2="200" class="relation" marker-start="url(#diamond)" marker-end="url(#association-arrow)"/>
  <text x="360" y="190" class="section">1</text>
  <text x="405" y="190" class="section">1</text>
  <text x="345" y="220" class="stereotype">events</text>

  <!-- Association: EventManager -> EventListener (0..*) -->
  <line x1="740" y1="195" x2="830" y2="195" class="relation" marker-end="url(#association-arrow)"/>
  <text x="750" y="185" class="section">1</text>
  <text x="810" y="185" class="section">0..*</text>
  <text x="755" y="215" class="stereotype">listeners</text>

  <!-- Realization: LogOpenListener implements EventListener -->
  <path d="M 390 420 L 390 350 L 920 350 L 920 260" class="relation dashed" marker-end="url(#hollow-triangle)"/>

  <!-- Realization: EmailNotificationListener implements EventListener -->
  <path d="M 820 420 L 820 350 L 1020 350 L 1020 260" class="relation dashed" marker-end="url(#hollow-triangle)"/>

  <!-- Client Driver Note -->
  <g transform="translate(50, 620)">
    <rect width="1080" height="60" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
    <text x="20" y="28" class="section" font-weight="700">Client Driver (Main):</text>
    <text x="20" y="48" class="section" fill="var(--muted)">Instantiates Editor, registers LogOpenListener and EmailNotificationListener to "open" and "save" events, triggers file operations, and demonstrates dynamic unsubscription.</text>
  </g>
</svg>
