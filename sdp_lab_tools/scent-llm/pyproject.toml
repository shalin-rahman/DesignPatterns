[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scent-llm"
version = "0.1.0"
description = "Generate LLM-integrating code and statically detect LLM code smells (NSO, UMM, TNES, NMVP, NSM)"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "google-genai>=1.0",
]

[project.scripts]
scent-llm = "scent_llm.cli:main"

[tool.setuptools.packages.find]
include = ["scent_llm*"]
